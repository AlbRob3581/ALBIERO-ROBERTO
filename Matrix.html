<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Matrix</title>
<style>
  *{margin:0;padding:0}
  body{background:#000;overflow:hidden;height:100vh}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight }
resize(); addEventListener('resize', resize);

const chars="ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾙﾚﾛﾜｦﾝ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const fontSize=16;
let columns=Math.floor(canvas.width/fontSize);
let drops=new Array(columns).fill(0).map(()=>Math.random()*-100);

function draw(){
  ctx.fillStyle="rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font=fontSize+"px monospace";
  for(let i=0;i<drops.length;i++){
    const t=chars[Math.floor(Math.random()*chars.length)];
    ctx.fillStyle=Math.random()>0.975?"#FFF":"#0F0";
    ctx.fillText(t,i*fontSize,drops[i]*fontSize);
    if(drops[i]*fontSize>canvas.height && Math.random()>0.975) drops[i]=0;
    drops[i]++;
  }
}
setInterval(draw,35);
</script>
</body>
</html>
