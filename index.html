<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creatore MISTO Pulsanti + Tendina</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto,sans-serif}
body{display:flex;height:100vh;background:#0f1115;color:#eee}
#left{width:420px;background:#171a21;border-right:1px solid #2a2f3a;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
#right{flex:1;display:flex;flex-direction:column;background:#0f1115}
h2{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8b95a8}
label{font-size:11px;color:#9aa5b8;display:block;margin:8px 0 4px;text-transform:uppercase;letter-spacing:.5px}
input,textarea,select{width:100%;padding:9px 11px;border-radius:10px;border:1px solid #2a2f3a;background:#0f1115;color:#fff;outline:none}
.row{display:flex;gap:8px}.row>*{flex:1}
button{padding:10px 12px;border-radius:11px;border:0;cursor:pointer;font-weight:700;transition:.15s;font-size:13px}
.btn-primary{background:#e60000;color:#fff}.btn-primary:hover{background:#ff1a1a}
.btn-ghost{background:#222834;color:#cbd5e1;border:1px solid #2a2f3a}.btn-ghost:hover{background:#2a3242}
.btn-small{padding:5px 9px;font-size:11px;border-radius:8px}
.tabs{display:flex;gap:6px;background:#0f1115;padding:4px;border-radius:10px;border:1px solid #2a2f3a}
.tab{flex:1;padding:8px;text-align:center;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;color:#8b95a8}
.tab.active{background:#e60000;color:#fff}
.panel{display:none;flex-direction:column;gap:10px}.panel.active{display:flex}
.item{background:#1f2531;border:1px solid #2a3242;border-radius:11px;padding:9px 10px;display:flex;justify-content:space-between;align-items:center}
.item b{font-size:12px;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{font-size:10px;color:#8b95a8;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff2;flex-shrink:0}
#previewWrap{flex:1;padding:20px;overflow:auto;display:grid;place-items:center;background:radial-gradient(ellipse at top,#1a1f2e,transparent),#0f1115}
#preview{width:min(900px,95%);min-height:520px;background:#fff;border-radius:22px;padding:36px;color:#111;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#171a21;border-bottom:1px solid #2a2f3a}
#codeOut{height:180px;background:#0a0c10;color:#c9d1d9;font-family:monospace;font-size:11px;white-space:pre;overflow:auto;padding:12px;display:none}
.upload{border:1.5px dashed #2a3242;border-radius:12px;padding:12px;text-align:center;background:#1a2030;cursor:pointer;font-size:13px}
.upload:hover{border-color:#e60000}
</style>
</head>
<body>
<div id="left">
  <div class="upload" onclick="document.getElementById('fileInput').click()">📂 Carica pagina esistente<br><small style="color:#8b95a8">pulsanti / tendina / mista</small></div>
  <input type="file" id="fileInput" accept=".html,.htm" style="display:none">

  <h2>⚙️ Pagina</h2>
  <label>Titolo</label><input id="pageTitle" value="La mia pagina mista">
  <label>Placeholder tendina</label><input id="placeholder" value="-- Naviga velocemente --">
  <div class="row"><div><label>Sfondo</label><input id="bgColor" type="color" value="#ffffff"></div><div><label>Mostra</label><select id="showMode"><option value="both">Tendina + Pulsanti</option><option value="select">Solo Tendina</option><option value="buttons">Solo Pulsanti</option></select></div></div>
  <label>Intro</label><textarea id="intro" rows="2" placeholder="Es: Scegli dove andare per Gabriele..."></textarea>

  <div class="tabs"><div class="tab active" onclick="switchTab('selectTab')">▼ Tendina</div><div class="tab" onclick="switchTab('buttonTab')">🔘 Pulsanti</div></div>

  <div id="selectTab" class="panel active">
    <label>Testo voce</label><input id="sText" placeholder="Es: Seminario">
    <label>Link file</label><input id="sLink" placeholder="seminario.html">
    <div class="row"><button class="btn-primary" onclick="addSelect()">+ Voce tendina</button><button class="btn-ghost" id="upS" style="display:none" onclick="confirmUpS()">✔️</button></div>
    <div id="sList" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>

  <div id="buttonTab" class="panel">
    <label>Testo pulsante</label><input id="bText" placeholder="Es: Vai da Gabriele">
    <label>Link file</label><input id="bLink" placeholder="gabriele.html">
    <div class="row"><div><label>Colore</label><input id="bColor" type="color" value="#e60000"></div><div><label>Testo</label><input id="bTxt" type="color" value="#ffffff"></div></div>
    <div class="row"><button class="btn-primary" onclick="addBtn()">+ Pulsante</button><button class="btn-ghost" id="upB" style="display:none" onclick="confirmUpB()">✔️</button></div>
    <div id="bList" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>
</div>

<div id="right">
  <div id="toolbar">
    <button class="btn-primary" onclick="download()">⬇️ Salva.html</button>
    <button class="btn-ghost" onclick="copy()">📋 Copia</button>
    <button class="btn-ghost" onclick="document.getElementById('codeOut').style.display=document.getElementById('codeOut').style.display==='block'?'none':'block'">👁️ Codice</button>
    <button class="btn-ghost" onclick="if(confirm('Reset tutto?')){selectOpts=[];btnOpts=[];render()}">🗑️ Reset</button>
    <span id="counts" style="margin-left:auto;color:#8b95a8;font-size:12px"></span>
  </div>
  <div id="previewWrap"><div id="preview"></div></div>
  <div id="codeOut"></div>
</div>

<script>
let selectOpts=[], btnOpts=[], editS=null, editB=null;
const $=id=>document.getElementById(id);
function switchTab(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));$(id).classList.add('active');document.querySelector(`[onclick="switchTab('${id}')"]`).classList.add('active');}

function addSelect(){const t=$('sText').value.trim(), l=$('sLink').value.trim(); if(!t||!l)return alert('Testo e link'); selectOpts.push({id:Date.now(),text:t,link:l}); $('sText').value='';$('sLink').value=''; render();}
function addBtn(){const t=$('bText').value.trim(), l=$('bLink').value.trim(), c=$('bColor').value, ct=$('bTxt').value; if(!t||!l)return alert('Testo e link'); btnOpts.push({id:Date.now(),text:t,link:l,color:c,txt:ct}); $('bText').value='';$('bLink').value=''; render();}
function editSItem(id){const o=selectOpts.find(x=>x.id===id); editS=id; $('sText').value=o.text; $('sLink').value=o.link; $('upS').style.display='block'; switchTab('selectTab');}
function editBItem(id){const o=btnOpts.find(x=>x.id===id); editB=id; $('bText').value=o.text; $('bLink').value=o.link; $('bColor').value=o.color; $('bTxt').value=o.txt; $('upB').style.display='block'; switchTab('buttonTab');}
function confirmUpS(){const i=selectOpts.findIndex(x=>x.id===editS); if(i>=0)selectOpts[i]={id:editS,text:$('sText').value.trim(),link:$('sLink').value.trim()}; editS=null; $('sText').value='';$('sLink').value='';$('upS').style.display='none'; render();}
function confirmUpB(){const i=btnOpts.findIndex(x=>x.id===editB); if(i>=0)btnOpts[i]={id:editB,text:$('bText').value.trim(),link:$('bLink').value.trim(),color:$('bColor').value,txt:$('bTxt').value}; editB=null; $('bText').value='';$('bLink').value='';$('upB').style.display='none'; render();}
function delS(id){selectOpts=selectOpts.filter(x=>x.id!==id); render();}
function delB(id){btnOpts=btnOpts.filter(x=>x.id!==id); render();}

function render(){
  $('sList').innerHTML=selectOpts.map(o=>`<div class="item"><div><b>▼ ${o.text}</b><small>${o.link}</small></div><div style="display:flex;gap:4px"><button class="btn-ghost btn-small" onclick="editSItem(${o.id})">✏️</button><button class="btn-ghost btn-small" onclick="delS(${o.id})">✕</button></div></div>`).join('');
  $('bList').innerHTML=btnOpts.map(o=>`<div class="item"><div style="display:flex;gap:8px;align-items:center"><div class="dot" style="background:${o.color}"></div><div><b>${o.text}</b><small>${o.link}</small></div></div><div style="display:flex;gap:4px"><button class="btn-ghost btn-small" onclick="editBItem(${o.id})">✏️</button><button class="btn-ghost btn-small" onclick="delB(${o.id})">✕</button></div></div>`).join('');
  $('counts').textContent=`▼ ${selectOpts.length} | 🔘 ${btnOpts.length}`;

  const title=$('pageTitle').value, ph=$('placeholder').value, bg=$('bgColor').value, intro=$('intro').value, mode=$('showMode').value;
  $('preview').style.background=bg;
  $('preview').innerHTML=`
    <h1 style="font-size:clamp(26px,4vw,40px);margin-bottom:8px">${title}</h1>
    ${intro?`<p style="color:#555;margin-bottom:18px">${intro}</p>`:''}
    ${mode!=='buttons'?`<div style="margin:16px 0"><label style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block">Navigazione rapida</label><select style="width:100%;padding:14px;border-radius:12px;border:2px solid #ddd;font-weight:700" onchange="if(this.value) location.href=this.value"><option value="">${ph}</option>${selectOpts.map(o=>`<option value="${o.link}">${o.text}</option>`).join('')}</select></div>`:''}
    ${mode!=='select'?`<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:18px">${btnOpts.map(o=>`<a href="${o.link}" style="background:${o.color};color:${o.txt};padding:14px 20px;border-radius:12px;text-decoration:none;font-weight:800;min-width:120px;text-align:center;display:inline-block">${o.text}</a>`).join('')||'<span style="color:#aaa">Nessun pulsante...</span>'}</div>`:''}
  `;
  $('codeOut').textContent=gen();
}
function gen(){
  const title=$('pageTitle').value, ph=$('placeholder').value, bg=$('bgColor').value, intro=$('intro').value, mode=$('showMode').value;
  return `<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${title}</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:${bg};font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:900px;width:100%;background:rgba(255,255,255,.96);border-radius:24px;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.15)}h1{font-size:clamp(26px,4vw,42px);margin-bottom:10px}p{color:#555;margin-bottom:20px}label.small{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}select{width:100%;padding:15px;border-radius:12px;border:2px solid #e5e7eb;font-weight:700;font-size:15px;background:#fff}select:focus{border-color:#e60000;outline:none}.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.btn{padding:14px 22px;border-radius:12px;text-decoration:none;font-weight:800;display:inline-block;transition:.18s;min-width:120px;text-align:center}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(0,0,0,.15)}</style></head>
<body><div class="card"><h1>${title}</h1>${intro?`<p>${intro}</p>`:''}
${mode!=='buttons'?`<div><label class="small">Vai a:</label><select onchange="if(this.value) window.location.href=this.value"><option value="">${ph}</option>
${selectOpts.map(o=>` <option value="${o.link}">${o.text}</option>`).join('\n')}
</select></div>`:''}
${mode!=='select'?`<div class="btns">
${btnOpts.map(o=>` <a href="${o.link}" class="btn" style="background:${o.color};color:${o.txt}">${o.text}</a>`).join('\n')}
</div>`:''}
</div></body></html>`;
}
function download(){const blob=new Blob([gen()],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=($('pageTitle').value||'pagina-mista').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html';a.click();}
function copy(){navigator.clipboard.writeText(gen());alert('Codice copiato!');}

// CARICA PAGINE PRECEDENTI - RICONOSCE TUTTO
document.getElementById('fileInput').addEventListener('change', async e=>{
  const file=e.target.files[0]; if(!file)return;
  const text=await file.text();
  const doc=new DOMParser().parseFromString(text,'text/html');
  $('pageTitle').value=doc.querySelector('title')?.textContent?.trim()||'Pagina';
  const intro=doc.querySelector('.card p')||doc.querySelector('.container p')||doc.querySelector('p'); if(intro) $('intro').value=intro.textContent.trim();
  const sel=doc.querySelector('select');
  if(sel){
    $('placeholder').value=sel.querySelector('option[value=""]')?.textContent?.trim()||'-- Seleziona --';
    selectOpts=[...sel.querySelectorAll('option[value]:not([value=""])')].map(o=>({id:Date.now()+Math.random(),text:o.textContent.trim(),link:o.value}));
  }
  const btns=[...doc.querySelectorAll('a.btn,.btns a,.container a.btn')].filter(a=>!a.closest('select'));
  // se la pagina vecchia aveva solo btn senza classe.btn, prendili ma evita duplicati con select
  const moreBtns=[...doc.querySelectorAll('.container.btns a,.card.btns a')];
  const allLinks=moreBtns.length?moreBtns:btns;
  if(allLinks.length){
    btnOpts=allLinks.map(a=>{
      const st=a.getAttribute('style')||'';
      const bg=(st.match(/background:\s*([^;]+)/i)?.[1]||'#e60000').trim();
      const col=(st.match(/color:\s*([^;]+)/i)?.[1]||'#ffffff').trim();
      return {id:Date.now()+Math.random(),text:a.textContent.trim(),link:a.getAttribute('href')||'#',color:bg.startsWith('rgb')?rgb2hex(bg):bg,txt:col.startsWith('rgb')?rgb2hex(col):col}
    }).filter(b=>b.text);
  }
  const bgMatch=text.match(/body\{[^}]*background:\s*([^;}\s]+)/i); if(bgMatch && bgMatch[1].startsWith('#')) $('bgColor').value=bgMatch[1];
  if(selectOpts.length && btnOpts.length) $('showMode').value='both'; else if(selectOpts.length) $('showMode').value='select'; else $('showMode').value='buttons';
  render(); alert(`Caricato! ▼ ${selectOpts.length} voci tendina + 🔘 ${btnOpts.length} pulsanti`);
});
function rgb2hex(c){const m=c.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/i); if(!m)return c; return '#'+m.slice(1,4).map(x=>parseInt(x).toString(16).padStart(2,'0')).join('');}
['pageTitle','placeholder','bgColor','intro','showMode'].forEach(id=>$(id).addEventListener('input',render));
render();
</script>
</body>
</html>
