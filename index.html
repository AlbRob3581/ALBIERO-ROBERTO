<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix - ALBIERO ROBERTO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;height:100vh;width:100vw;font-family:monospace;cursor:pointer}
canvas{position:absolute;top:0;left:0}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0F0;text-align:center;z-index:10;width:90%}
h1{font-size:clamp(28px,6vw,60px);letter-spacing:8px;font-weight:bold;text-shadow:0 0 10px #0F0,0 0 30px #0F0}
.status{margin-top:20px;font-size:14px;letter-spacing:3px}
.cursor{animation:blink.6s infinite}@keyframes blink{50%{opacity:0}}
#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#0F0;opacity:.6;font-size:12px;letter-spacing:2px;z-index:10}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="center">
  <h1 id="name"></h1>
  <div class="status" id="status">[ CLICCA OVUNQUE PER AVVIARE L'HACK ]</div>
</div>
<div id="hint">► AUDIO ON ◄</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
const chars="ｱｲｳｴｵｶｷｸｹｺｻｼ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
let drops=new Array(Math.floor(innerWidth/14)).fill(0).map(()=>Math.random()*-50);
setInterval(()=>{ctx.fillStyle="rgba(0,0,0,0.05)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.font="14px monospace";drops.forEach((y,i)=>{ctx.fillStyle=Math.random()>0.99?"#FFF":"#0F0";ctx.fillText(chars[Math.random()*chars.length|0],i*14,y*14);drops[i]=y*14>innerHeight&&Math.random()>0.975?0:y+1})},35);

let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function tick(f=1000){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=f+Math.random()*400;g.gain.value=0.12;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.06);o.stop(audioCtx.currentTime+0.06)}
function granted(){[440,554,659].forEach((fr,i)=>{setTimeout(()=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=fr;g.gain.value=0.3;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5);o.stop(audioCtx.currentTime+0.5)},i*150)})}

const finalText="ALBIERO ROBERTO",hack="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
let started=false,iter=0,sIdx=0;
const nameEl=document.getElementById('name'),statusEl=document.getElementById('status');
const statuses=["[ SCANSIONE RETE... ]","[ BYPASS FIREWALL... 27% ]","[ BYPASS FIREWALL... 68% ]","[ ACCESSO MAINFRAME... ]","[ DECODIFICA... ]","[ ACCESSO CONCESSO ]"];

function start(){if(started)return;started=true;initAudio();document.getElementById('hint').style.display='none';
 setInterval(()=>{if(sIdx<statuses.length){statusEl.textContent="> "+statuses[sIdx];tick(600+sIdx*80);sIdx++}},650);
 const iv=setInterval(()=>{
   let out="";for(let i=0;i<finalText.length;i++){out+=finalText[i]==" "?" ":i<iter?finalText[i]:hack[Math.random()*hack.length|0]}
   nameEl.innerHTML=out+'<span class="cursor">_</span>';if(Math.random()>0.3)tick(1100+Math.random()*800);
   if(iter>=finalText.length){clearInterval(iv);granted();statusEl.innerHTML="> SYSTEM ACCESS GRANTED - BENVENUTO ALBIERO ROBERTO";statusEl.style.textShadow="0 0 10px #0F0"}
   iter+=0.45;
 },65);
}
addEventListener('click',start);addEventListener('touchstart',start);
</script>
</body>
</html>
