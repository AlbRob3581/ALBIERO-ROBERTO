<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creatore Pagine a Pulsanti</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto,sans-serif}
body{display:flex;height:100vh;background:#0f1115;color:#eee}
#left{width:380px;background:#171a21;border-right:1px solid #2a2f3a;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
#right{flex:1;display:flex;flex-direction:column;background:#0f1115}
h2{font-size:16px;letter-spacing:1px;text-transform:uppercase;color:#8b95a8}
label{font-size:12px;color:#9aa5b8;display:block;margin-bottom:4px;margin-top:10px;text-transform:uppercase;letter-spacing:.6px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2a2f3a;background:#0f1115;color:#fff;outline:none}
input:focus,select:focus{border-color:#e60000}
.row{display:flex;gap:8px}.row>*{flex:1}
button{padding:11px 14px;border-radius:12px;border:0;cursor:pointer;font-weight:700;letter-spacing:.3px;transition:.15s}
.btn-primary{background:#e60000;color:#fff}.btn-primary:hover{background:#ff1a1a;transform:translateY(-1px)}
.btn-ghost{background:#222834;color:#cbd5e1;border:1px solid #2a2f3a}.btn-ghost:hover{background:#2a3242}
.btn-small{padding:6px 10px;font-size:12px;border-radius:8px}
#buttonsList{display:flex;flex-direction:column;gap:8px}
.item{background:#1f2531;border:1px solid #2a3242;border-radius:12px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;display:block}
.item small{color:#8b95a8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;display:block}
.colorDot{width:14px;height:14px;border-radius:50%;border:2px solid #fff2}
#previewWrap{flex:1;padding:20px;overflow:auto;display:grid;place-items:center;background:radial-gradient(ellipse at top,#1a1f2e,transparent),#0f1115}
#preview{width:min(900px,95%);min-height:500px;background:#fff;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:40px;color:#111;position:relative}
#preview h1{font-size:clamp(24px,4vw,42px);margin-bottom:20px}
#preview .btns{display:flex;flex-wrap:wrap;gap:14px}
#preview .genBtn{padding:14px 22px;border-radius:14px;text-decoration:none;font-weight:800;display:inline-block;transition:.15s;text-align:center;min-width:120px}
#preview .genBtn:hover{transform:translateY(-2px) scale(1.02);filter:brightness(1.1)}
#toolbar{display:flex;gap:10px;padding:12px 18px;background:#171a21;border-top:1px solid #2a2f3a;border-bottom:1px solid #2a2f3a}
#codeOut{height:160px;background:#0a0c10;color:#c9d1d9;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre;overflow:auto;padding:12px;border-radius:0 0 12px 12px;display:none}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tab{padding:6px 12px;border-radius:20px;background:#1f2531;color:#8b95a8;font-size:12px;cursor:pointer;border:1px solid #2a3242}
.tab.active{background:#e60000;color:#fff;border-color:#e60000}
</style>
</head>
<body>
<div id="left">
  <h2>⚙️ Impostazioni Pagina</h2>
  <div>
    <label>Titolo pagina</label>
    <input id="pageTitle" value="Le mie pagine">
    <label>Colore sfondo</label>
    <input id="bgColor" type="color" value="#ffffff">
    <label>Testo introduttivo (opzionale)</label>
    <textarea id="intro" rows="2" placeholder="Es: Scegli dove andare..."></textarea>
  </div>

  <h2>🔘 Aggiungi Pulsante</h2>
  <div>
    <label>Testo del pulsante</label>
    <input id="btnText" placeholder="Es: Vai a Gabriele">
    <label>Link a file HTML</label>
    <input id="btnLink" placeholder="Es: gabriele.html oppure ./pagine/gabriele.html">
    <div class="row">
      <div><label>Colore</label><input id="btnColor" type="color" value="#e60000"></div>
      <div><label>Testo</label><input id="txtColor" type="color" value="#ffffff"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn-primary" onclick="addButton()">+ Aggiungi</button>
      <button class="btn-ghost" onclick="clearForm()">Pulisci</button>
    </div>
  </div>

  <h2>📋 Pulsanti creati (<span id="count">0</span>)</h2>
  <div id="buttonsList"></div>
</div>

<div id="right">
  <div id="toolbar">
    <button class="btn-primary" onclick="downloadHTML()">⬇️ Scarica pagina .html</button>
    <button class="btn-ghost" onclick="copyCode()">📋 Copia codice</button>
    <button class="btn-ghost" onclick="toggleCode()">👁️ Vedi codice</button>
    <button class="btn-ghost" onclick="clearAll()">🗑️ Reset</button>
  </div>
  <div id="previewWrap">
    <div id="preview"></div>
  </div>
  <div id="codeOut"></div>
</div>

<script>
let buttons=[];
function addButton(){
  const text=document.getElementById('btnText').value.trim();
  const link=document.getElementById('btnLink').value.trim();
  const color=document.getElementById('btnColor').value;
  const txt=document.getElementById('txtColor').value;
  if(!text||!link){alert('Inserisci testo e link file html');return}
  buttons.push({id:Date.now(),text,link,color,txt});
  document.getElementById('btnText').value='';document.getElementById('btnLink').value='';
  render();
}
function removeButton(id){buttons=buttons.filter(b=>b.id!==id);render()}
function clearForm(){document.getElementById('btnText').value='';document.getElementById('btnLink').value=''}
function clearAll(){if(confirm('Cancellare tutto?')){buttons=[];render()}}
function render(){
  document.getElementById('count').textContent=buttons.length;
  const list=document.getElementById('buttonsList');
  list.innerHTML=buttons.map(b=>`
    <div class="item">
      <div style="display:flex;gap:10px;align-items:center">
        <div class="colorDot" style="background:${b.color}"></div>
        <div><b>${b.text}</b><small>${b.link}</small></div>
      </div>
      <button class="btn-ghost btn-small" onclick="removeButton(${b.id})">✕</button>
    </div>`).join('');
  
  const title=document.getElementById('pageTitle').value||'Le mie pagine';
  const bg=document.getElementById('bgColor').value;
  const intro=document.getElementById('intro').value;
  const preview=document.getElementById('preview');
  preview.style.background=bg;
  preview.innerHTML=`
    <h1>${title}</h1>
    ${intro?`<p style="margin-bottom:22px;color:#444">${intro}</p>`:''}
    <div class="btns">
      ${buttons.map(b=>`<a href="${b.link}" class="genBtn" style="background:${b.color};color:${b.txt}">${b.text}</a>`).join('') || '<span style="color:#999">Nessun pulsante ancora...</span>'}
    </div>
  `;
  document.getElementById('codeOut').textContent=generateHTML();
}
function generateHTML(){
  const title=document.getElementById('pageTitle').value||'Le mie pagine';
  const bg=document.getElementById('bgColor').value;
  const intro=document.getElementById('intro').value;
  return `<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:${bg};font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:30px}
.container{max-width:900px;width:100%;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-radius:24px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
h1{font-size:clamp(26px,4vw,44px);margin-bottom:12px}
p{color:#555;margin-bottom:24px;font-size:16px}
.btns{display:flex;flex-wrap:wrap;gap:14px}
.btn{padding:15px 26px;border-radius:14px;text-decoration:none;font-weight:800;display:inline-block;transition:.18s;min-width:130px;text-align:center}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 20px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="container">
<h1>${title}</h1>
${intro?`<p>${intro}</p>`:''}
<div class="btns">
${buttons.map(b=>`  <a href="${b.link}" class="btn" style="background:${b.color};color:${b.txt}">${b.text}</a>`).join('\n')}
</div>
</div>
</body>
</html>`;
}
function downloadHTML(){
  const blob=new Blob([generateHTML()],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const name=(document.getElementById('pageTitle').value||'pagina').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html';
  a.download=name;a.click();
}
function copyCode(){navigator.clipboard.writeText(generateHTML());alert('Codice copiato!')}
function toggleCode(){const c=document.getElementById('codeOut');c.style.display=c.style.display==='block'?'none':'block'}
document.getElementById('pageTitle').addEventListener('input',render);
document.getElementById('bgColor').addEventListener('input',render);
document.getElementById('intro').addEventListener('input',render);
render();
</script>
</body>
</html>
