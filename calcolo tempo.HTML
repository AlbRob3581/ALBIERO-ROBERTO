<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore Data e Ora</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007aff;
            --primary-hover: #0056b3;
            --secondary-color: #6c757d;
            --border-color: #cccccc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
            color: #111;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row input {
            flex: 1;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            margin-bottom: 16px;
            padding: 8px;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background-color: rgba(0, 122, 255, 0.05);
        }

        .result-box {
            margin-top: 24px;
            padding: 16px;
            background-color: #f8f9fa;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
            display: none;
        }

        .result-box h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: var(--secondary-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-text {
            font-size: 20px;
            font-weight: 700;
            color: #111;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calcolatore Tempo</h1>

    <button type="button" class="btn-secondary" onclick="impostaOraAttuale()">🕒 Inserisci Data e Ora Corrente</button>

    <div class="form-group">
        <label for="data">Data iniziale</label>
        <input type="date" id="data" required>
    </div>

    <div class="form-group">
        <label for="ora">Ora iniziale</label>
        <input type="time" id="ora" step="1" required>
    </div>

    <div class="form-group">
        <label for="operazione">Operazione</label>
        <select id="operazione">
            <option value="aggiungi">Aggiungi (+)</option>
            <option value="sottrai">Sottrai (-)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="quantita">Quantità da modificare</label>
        <div class="row">
            <input type="number" id="quantita" min="0" placeholder="Es. 180" required>
            <select id="unita" style="max-width: 120px;">
                <option value="minuti">Minuti</option>
                <option value="ore">Ore</option>
                <option value="giorni">Giorni</option>
            </select>
        </div>
    </div>

    <button type="button" class="btn-primary" onclick="calcolaTempo()">Calcola Risultato</button>

    <div class="result-box" id="risultatoBox">
        <h3>Nuova Data e Ora</h3>
        <p class="result-text" id="risultatoTesto">-</p>
    </div>
</div>

<script>
    // Funzione per inserire automaticamente i valori correnti del sistema
    function impostaOraAttuale() {
        const oraAttuale = new Date();
        
        // Formatta la data come YYYY-MM-DD
        const anno = oraAttuale.getFullYear();
        const mese = String(oraAttuale.getMonth() + 1).padStart(2, '0');
        const giorno = String(oraAttuale.getDate()).padStart(2, '0');
        document.getElementById('data').value = `${anno}-${mese}-${giorno}`;
        
        // Formatta l'ora come HH:MM:SS
        const ore = String(oraAttuale.getHours()).padStart(2, '0');
        const minuti = String(oraAttuale.getMinutes()).padStart(2, '0');
        const secondi = String(oraAttuale.getSeconds()).padStart(2, '0');
        document.getElementById('ora').value = `${ore}:${minuti}:${secondi}`;
    }

    // Funzione principale di calcolo
    function calcolaTempo() {
        const dataInput = document.getElementById('data').value;
        const oraInput = document.getElementById('ora').value;
        const operazione = document.getElementById('operazione').value;
        const quantita = parseInt(document.getElementById('quantita').value);
        const unita = document.getElementById('unita').value;

        // Validazione minima dei campi obbligatori
        if (!dataInput || !oraInput || isNaN(quantita)) {
            alert("Per favore, compila tutti i campi correttamente.");
            return;
        }

        // Crea l'oggetto data unendo i due input del modulo
        const dataIniziale = new Date(`${dataInput}T${oraInput}`);
        
        // Calcola il fattore di moltiplicazione (positivo o negativo)
        const segno = operazione === 'aggiungi' ? 1 : -1;
        
        // Converte tutto il tempo della variazione in millisecondi
        let variazioneMillisecondi = 0;
        if (unita === 'minuti') {
            variazioneMillisecondi = quantita * 60 * 1000;
        } else if (unita === 'ore') {
            variazioneMillisecondi = quantita * 60 * 60 * 1000;
        } else if (unita === 'giorni') {
            variazioneMillisecondi = quantita * 24 * 60 * 60 * 1000;
        }

        // Applica la variazione temporale
        const dataRisultato = new Date(dataIniziale.getTime() + (variazioneMillisecondi * segno));

        // Formatta la stringa finale in stile italiano leggibile
        const opzioniFormato = { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        };
        
        const stringaFinale = dataRisultato.toLocaleDateString('it-IT', opzioniFormato);

        // Mostra il box dei risultati a schermo
        const box = document.getElementById('risultatoBox');
        const testo = document.getElementById('risultatoTesto');
        
        testo.textContent = stringaFinale;
        box.style.display = 'block';
    }
</script>

</body>
</html>
